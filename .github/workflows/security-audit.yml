name: Dependency security audit

on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock"]
  schedule:
    - cron: "43 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # rust_decimal locks rkyv as an optional dependency, but its rkyv
          # feature is disabled; `cargo tree -e features -i rkyv` is empty.
          ignore: RUSTSEC-2026-0235
