name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo package --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: polymarket-mcp-rs-linux-x86_64
            binary: polymarket-mcp-rs
            archive: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: polymarket-mcp-rs-linux-aarch64
            binary: polymarket-mcp-rs
            archive: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: polymarket-mcp-rs-macos-x86_64
            binary: polymarket-mcp-rs
            archive: tar
          - os: macos-15
            target: aarch64-apple-darwin
            asset: polymarket-mcp-rs-macos-aarch64
            binary: polymarket-mcp-rs
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: polymarket-mcp-rs-windows-x86_64
            binary: polymarket-mcp-rs.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir stage
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" stage/polymarket-mcp-rs
          cp README.md LICENSE stage/
          tar -C stage -czf "${{ matrix.asset }}.tar.gz" polymarket-mcp-rs README.md LICENSE
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" stage/polymarket-mcp-rs.exe
          Copy-Item README.md, LICENSE stage/
          Compress-Archive -Path stage/* -DestinationPath "${{ matrix.asset }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Assemble cross-platform MCP Bundle
        run: |
          mkdir -p bundle/server
          cp packaging/mcpb/manifest.json bundle/manifest.json
          cp packaging/mcpb/server/launch bundle/server/launch
          chmod +x bundle/server/launch
          version="${GITHUB_REF_NAME#v}"
          jq --arg version "$version" '.version = $version' bundle/manifest.json > bundle/manifest.tmp
          mv bundle/manifest.tmp bundle/manifest.json

          mkdir extracted
          tar -xzf dist/polymarket-mcp-rs-linux-x86_64.tar.gz -C extracted
          cp extracted/polymarket-mcp-rs bundle/server/polymarket-mcp-rs-linux-x86_64
          rm -rf extracted/*
          tar -xzf dist/polymarket-mcp-rs-linux-aarch64.tar.gz -C extracted
          cp extracted/polymarket-mcp-rs bundle/server/polymarket-mcp-rs-linux-aarch64
          rm -rf extracted/*
          tar -xzf dist/polymarket-mcp-rs-macos-x86_64.tar.gz -C extracted
          cp extracted/polymarket-mcp-rs bundle/server/polymarket-mcp-rs-macos-x86_64
          rm -rf extracted/*
          tar -xzf dist/polymarket-mcp-rs-macos-aarch64.tar.gz -C extracted
          cp extracted/polymarket-mcp-rs bundle/server/polymarket-mcp-rs-macos-aarch64
          unzip -q dist/polymarket-mcp-rs-windows-x86_64.zip -d extracted
          cp extracted/polymarket-mcp-rs.exe bundle/server/polymarket-mcp-rs.exe
          chmod +x bundle/server/polymarket-mcp-rs-*

          npx --yes @anthropic-ai/mcpb validate bundle/manifest.json
          npx --yes @anthropic-ai/mcpb pack bundle dist/polymarket-mcp.mcpb
      - name: Generate package-manager manifests
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          linux_x64_sha="$(sha256sum dist/polymarket-mcp-rs-linux-x86_64.tar.gz | awk '{print $1}')"
          linux_arm_sha="$(sha256sum dist/polymarket-mcp-rs-linux-aarch64.tar.gz | awk '{print $1}')"
          macos_x64_sha="$(sha256sum dist/polymarket-mcp-rs-macos-x86_64.tar.gz | awk '{print $1}')"
          macos_arm_sha="$(sha256sum dist/polymarket-mcp-rs-macos-aarch64.tar.gz | awk '{print $1}')"
          windows_sha="$(sha256sum dist/polymarket-mcp-rs-windows-x86_64.zip | awk '{print $1}')"

          cat > dist/polymarket-mcp-rs.rb <<EOF
          class PolymarketMcpRs < Formula
            desc "Polymarket market intelligence and optional trading over MCP"
            homepage "https://github.com/beejmaxx/polymarket-mcp-rs"
            version "${version}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${release_base}/polymarket-mcp-rs-macos-aarch64.tar.gz"
                sha256 "${macos_arm_sha}"
              else
                url "${release_base}/polymarket-mcp-rs-macos-x86_64.tar.gz"
                sha256 "${macos_x64_sha}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${release_base}/polymarket-mcp-rs-linux-aarch64.tar.gz"
                sha256 "${linux_arm_sha}"
              else
                url "${release_base}/polymarket-mcp-rs-linux-x86_64.tar.gz"
                sha256 "${linux_x64_sha}"
              end
            end

            def install
              bin.install "polymarket-mcp-rs"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/polymarket-mcp-rs --version")
            end
          end
          EOF

          jq -n \
            --arg version "$version" \
            --arg url "${release_base}/polymarket-mcp-rs-windows-x86_64.zip" \
            --arg hash "$windows_sha" \
            '{
              version: $version,
              description: "Polymarket market intelligence and optional trading over MCP",
              homepage: "https://github.com/beejmaxx/polymarket-mcp-rs",
              license: "MIT",
              architecture: {"64bit": {url: $url, hash: $hash}},
              bin: "polymarket-mcp-rs.exe",
              checkver: {github: "https://github.com/beejmaxx/polymarket-mcp-rs"},
              autoupdate: {architecture: {"64bit": {url: "https://github.com/beejmaxx/polymarket-mcp-rs/releases/download/v$version/polymarket-mcp-rs-windows-x86_64.zip"}}}
            }' > dist/polymarket-mcp-rs.scoop.json

          winget_dir="$(mktemp -d)"
          cat > "$winget_dir/beejmaxx.PolymarketMCP.yaml" <<EOF
          PackageIdentifier: beejmaxx.PolymarketMCP
          PackageVersion: ${version}
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.12.0
          EOF
          cat > "$winget_dir/beejmaxx.PolymarketMCP.locale.en-US.yaml" <<EOF
          PackageIdentifier: beejmaxx.PolymarketMCP
          PackageVersion: ${version}
          PackageLocale: en-US
          Publisher: beejmaxx
          PackageName: Polymarket MCP
          License: MIT
          ShortDescription: Polymarket market intelligence and optional trading over MCP
          PackageUrl: https://github.com/beejmaxx/polymarket-mcp-rs
          LicenseUrl: https://github.com/beejmaxx/polymarket-mcp-rs/blob/v${version}/LICENSE
          ManifestType: defaultLocale
          ManifestVersion: 1.12.0
          EOF
          cat > "$winget_dir/beejmaxx.PolymarketMCP.installer.yaml" <<EOF
          PackageIdentifier: beejmaxx.PolymarketMCP
          PackageVersion: ${version}
          MinimumOSVersion: 10.0.17763.0
          InstallerType: zip
          NestedInstallerType: portable
          NestedInstallerFiles:
            - RelativeFilePath: polymarket-mcp-rs.exe
              PortableCommandAlias: polymarket-mcp-rs
          Installers:
            - Architecture: x64
              InstallerUrl: ${release_base}/polymarket-mcp-rs-windows-x86_64.zip
              InstallerSha256: ${windows_sha}
          ManifestType: installer
          ManifestVersion: 1.12.0
          EOF
          (cd "$winget_dir" && zip -q "$GITHUB_WORKSPACE/dist/polymarket-mcp-rs.winget.zip" ./*.yaml)
          rm -rf "$winget_dir"
      - name: Generate software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: ./dist
          format: spdx-json
          output-file: ./dist/polymarket-mcp-rs.spdx.json
          upload-artifact: false
      - name: Generate checksums
        working-directory: dist
        run: |
          for asset in ./*.tar.gz ./*.zip ./*.mcpb ./*.rb ./*.json; do
            sha256sum "$asset" > "$asset.sha256"
          done
          sha256sum ./*.tar.gz ./*.zip ./*.mcpb ./*.rb ./*.json > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.mcpb
            dist/*.rb
            dist/*.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
      - name: Create MCP Registry metadata
        run: |
          mcpb_sha="$(sha256sum dist/polymarket-mcp.mcpb | awk '{print $1}')"
          version="${GITHUB_REF_NAME#v}"
          jq -n \
            --arg version "$version" \
            --arg sha "$mcpb_sha" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/polymarket-mcp.mcpb" \
            '{
              "$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
              "name": "io.github.beejmaxx/polymarket-mcp",
              "title": "Polymarket MCP",
              "description": "Polymarket market data, live CLOB books, replay, simulation, and opt-in trading in Rust.",
              "repository": {"url": "https://github.com/beejmaxx/polymarket-mcp-rs", "source": "github"},
              "version": $version,
              "packages": [{
                "registryType": "mcpb",
                "identifier": $url,
                "fileSha256": $sha,
                "transport": {"type": "stdio"}
              }]
            }' > server.json
      - name: Publish to the official MCP Registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
