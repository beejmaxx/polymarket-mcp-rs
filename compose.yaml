services:
  polymarket-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      POLYMARKET_HTTP_ALLOWED_HOSTS: localhost,127.0.0.1
      POLYMARKET_HTTP_RATE_LIMIT_PER_MINUTE: "120"
      POLYMARKET_CACHE_TTL_MS: "2000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
