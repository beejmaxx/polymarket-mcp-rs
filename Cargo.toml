[package]
name = "polymarket-mcp-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A read-only Polymarket CLOB V2 MCP server"
license = "MIT"
repository = "https://github.com/beejmaxx/polymarket-mcp-rs"

[dependencies]
polymarket_client_sdk_v2 = { version = "0.7.0", features = ["clob", "gamma"] }
rmcp = { version = "3.1.0", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "3.1.0", features = ["client"] }

[profile.release]
lto = "thin"
strip = true
