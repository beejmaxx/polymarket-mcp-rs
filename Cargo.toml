[package]
name = "polymarket-mcp-rs"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
description = "A Polymarket market-data, replay, simulation, and opt-in trading MCP server"
license = "MIT"
repository = "https://github.com/beejmaxx/polymarket-mcp-rs"
homepage = "https://github.com/beejmaxx/polymarket-mcp-rs"
readme = "README.md"
keywords = ["mcp", "polymarket", "prediction-markets", "trading"]
categories = ["command-line-utilities", "finance"]

[dependencies]
alloy = { version = "1.6.3", default-features = false, features = ["signer-local", "signers"] }
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
polymarket_client_sdk_v2 = { version = "0.7.0", features = ["clob", "data", "gamma", "ws"] }
rmcp = { version = "3.1.0", features = ["transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-socks = "0.5.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["catch-panic", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "3.1.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
